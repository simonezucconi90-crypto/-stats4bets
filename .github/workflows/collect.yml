name: Stats4Bets Collector Step 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          pip install -r requirements-collector.txt
          playwright install --with-deps chromium

      - name: Login e apertura MindBet
        env:
          STATS4BETS_USER: ${{ secrets.STATS4BETS_USER }}
          STATS4BETS_PASSWORD: ${{ secrets.STATS4BETS_PASSWORD }}
          STATS4BETS_LOGIN_URL: https://superfoglio.it/
        run: python collector.py

      - name: Carica screenshot e HTML diagnostici
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stats4bets-step1-artifacts
          path: collector_artifacts/
          if-no-files-found: warn
          retention-days: 7
