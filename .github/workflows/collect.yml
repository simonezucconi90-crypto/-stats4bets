name: Stats4Bets Collector Step 4 Supabase

"on":
  workflow_dispatch: {}
  schedule:
    # Orari candidati UTC: il filtro iniziale mantiene gli orari italiani
    # 00:10, 06:10, 10:10, 14:10, 18:10 e 21:10 anche con l'ora legale.
    - cron: "10 4 * * *"
    - cron: "10 5 * * *"
    - cron: "10 8 * * *"
    - cron: "10 9 * * *"
    - cron: "10 12 * * *"
    - cron: "10 13 * * *"
    - cron: "10 16 * * *"
    - cron: "10 17 * * *"
    - cron: "10 19 * * *"
    - cron: "10 20 * * *"
    - cron: "10 22 * * *"
    - cron: "10 23 * * *"
    # Tentativi di sicurezza subito dopo mezzanotte italiana.
    - cron: "20 22 * * *"
    - cron: "20 23 * * *"
    - cron: "30 22 * * *"
    - cron: "30 23 * * *"
  push:
    branches:
      - main
    paths:
      - collector.py

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Verifica orario italiano
        id: schedule_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event = os.environ.get("EVENT_NAME", "")
          schedule = os.environ.get("SCHEDULE", "")
          run = True
          if event == "schedule":
              utc_hour = int(schedule.split()[1])
              now_rome = datetime.now(ZoneInfo("Europe/Rome"))
              offset = int(now_rome.utcoffset().total_seconds() // 3600)
              local_hour = (utc_hour + offset) % 24
              run = local_hour in {0, 6, 10, 14, 18, 21}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"run={'true' if run else 'false'}\n")
          PY

      - uses: actions/checkout@v4
        if: steps.schedule_gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.schedule_gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        if: steps.schedule_gate.outputs.run == 'true'
        run: |
          pip install -r requirements-collector.txt
          playwright install --with-deps chromium

      - name: Estrai e salva su Supabase
        if: steps.schedule_gate.outputs.run == 'true'
        env:
          STATS4BETS_USER: ${{ secrets.STATS4BETS_USER }}
          STATS4BETS_PASSWORD: ${{ secrets.STATS4BETS_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python collector.py
