name: Stats4Bets Collector Step 3 Dettagli

"on":
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          pip install -r requirements-collector.txt
          playwright install --with-deps chromium

      - name: Estrai dettagli Ottimo 1
        env:
          STATS4BETS_USER: ${{ secrets.STATS4BETS_USER }}
          STATS4BETS_PASSWORD: ${{ secrets.STATS4BETS_PASSWORD }}
        run: python collector.py

      - name: Carica risultati
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stats4bets-step3-details-artifacts
          path: collector_artifacts/
          if-no-files-found: warn
          retention-days: 7
