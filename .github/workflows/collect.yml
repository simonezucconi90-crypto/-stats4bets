name: Stats4Bets Collector Step 4 Supabase

"on":
  workflow_dispatch: {}
  schedule:
    # Aggiornamento automatico ogni 3 ore, al minuto 17 (UTC).
    - cron: "17 */3 * * *"
    # Controlli notturni: garantiscono una sessione alle 01:30 italiane
    # sia con ora solare sia con ora legale (l’esecuzione extra è innocua).
    - cron: "30 23,0 * * *"
  push:
    branches:
      - main
    paths:
      - collector.py

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          pip install -r requirements-collector.txt
          playwright install --with-deps chromium

      - name: Estrai e salva su Supabase
        env:
          STATS4BETS_USER: ${{ secrets.STATS4BETS_USER }}
          STATS4BETS_PASSWORD: ${{ secrets.STATS4BETS_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python collector.py
