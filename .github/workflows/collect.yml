name: Stats4Bets Collector Step 4 Supabase

on:
  workflow_dispatch: {}
  schedule:
    # Ora italiana, anche al cambio dell'ora legale.
    - cron: "10 0,6,10,14,18,21 * * *"
      timezone: "Europe/Rome"
    # Tentativi di sicurezza dopo mezzanotte.
    - cron: "20,30 0 * * *"
      timezone: "Europe/Rome"
  push:
    branches:
      - main
    paths:
      - collector.py
      - .github/workflows/collect.yml

permissions:
  contents: write

concurrency:
  group: stats4bets-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          pip install -r requirements-collector.txt
          playwright install --with-deps chromium

      - name: Estrai e salva su Supabase
        env:
          STATS4BETS_USER: ${{ secrets.STATS4BETS_USER }}
          STATS4BETS_PASSWORD: ${{ secrets.STATS4BETS_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python collector.py

      - name: Pubblica orario della raccolta completata
        env:
          COLLECTOR_STATUS_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from datetime import datetime, timezone
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          branch = "collector-status"
          url = os.environ["GITHUB_API_URL"] + "/repos/" + os.environ["GITHUB_REPOSITORY"] + "/contents/collector-status.json"
          headers = {
              "Authorization": "Bearer " + os.environ["COLLECTOR_STATUS_TOKEN"],
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
          }

          def request(address, data=None):
              body = json.dumps(data).encode() if data is not None else None
              method = "PUT" if data is not None else "GET"
              with urlopen(Request(address, data=body, headers=headers, method=method), timeout=15) as response:
                  return json.load(response)

          status = {
              "completed_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
          }
          payload = {
              "message": "Record successful match collection",
              "branch": branch,
              "content": base64.b64encode((json.dumps(status) + "\n").encode()).decode(),
          }
          try:
              payload["sha"] = request(url + "?ref=" + branch)["sha"]
          except HTTPError as exc:
              if exc.code != 404:
                  raise
          request(url, payload)
          print("Orario raccolta salvato:", status["completed_at"])
          PY
