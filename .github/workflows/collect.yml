name: Stats4Bets Collector Step 4 Supabase

on:
  workflow_dispatch: {}
  schedule:
    # Ora italiana, anche al cambio dell'ora legale.
    - cron: "10 0,6,10,14,18,21 * * *"
      timezone: "Europe/Rome"
    # Tentativi di sicurezza dopo mezzanotte.
    - cron: "20,30 0 * * *"
      timezone: "Europe/Rome"
  push:
    branches:
      - main
    paths:
      - collector.py
      - .github/workflows/collect.yml

permissions:
  contents: read

concurrency:
  group: stats4bets-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          pip install -r requirements-collector.txt
          playwright install --with-deps chromium

      - name: Estrai e salva su Supabase
        env:
          STATS4BETS_USER: ${{ secrets.STATS4BETS_USER }}
          STATS4BETS_PASSWORD: ${{ secrets.STATS4BETS_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python collector.py
