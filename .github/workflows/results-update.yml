name: Stats4Bets Aggiorna Risultati e Profitti

"on":
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: stats4bets-results-update
  cancel-in-progress: true

jobs:
  update-results:
    runs-on: ubuntu-22.04
    timeout-minutes: 8

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements-results.txt

      - name: Aggiorna risultati e profitti
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python update_results.py
