name: Aggiorna risultati e strategia Elite

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "update_results.py"
      - ".github/workflows/results-update.yml"
  schedule:
    # Orari candidati UTC per 06:30, 14:30 e 22:30 italiane.
    - cron: "30 4 * * *"
    - cron: "30 5 * * *"
    - cron: "30 12 * * *"
    - cron: "30 13 * * *"
    - cron: "30 20 * * *"
    - cron: "30 21 * * *"

concurrency:
  group: stats4bets-results-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Verifica orario italiano
        id: schedule_gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event = os.environ.get("EVENT_NAME", "")
          schedule = os.environ.get("SCHEDULE", "")
          run_results = True
          run_strategy = event in {"workflow_dispatch", "push"}

          if event == "schedule":
              utc_hour = int(schedule.split()[1])
              now_rome = datetime.now(ZoneInfo("Europe/Rome"))
              offset = int(now_rome.utcoffset().total_seconds() // 3600)
              local_hour = (utc_hour + offset) % 24
              run_results = local_hour in {6, 14, 22}
              run_strategy = local_hour in {6, 22}

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(
                  f"run_results={'true' if run_results else 'false'}\n"
              )
              output.write(
                  f"run_strategy={'true' if run_strategy else 'false'}\n"
              )
          PY

      - name: Checkout repository
        if: steps.schedule_gate.outputs.run_results == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.schedule_gate.outputs.run_results == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze risultati
        if: steps.schedule_gate.outputs.run_results == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: Aggiorna risultati
        if: steps.schedule_gate.outputs.run_results == 'true'
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          FOOTBALLDATA_IO_KEY: ${{ secrets.FOOTBALLDATA_IO_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python update_results.py

      - name: Installa dipendenze strategia
        if: steps.schedule_gate.outputs.run_strategy == 'true'
        run: pip install streamlit pandas numpy

      - name: Calcola Classifica Elite
        if: steps.schedule_gate.outputs.run_strategy == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python strategy_auto.py

      - name: Pubblica ultima Classifica Elite
        if: steps.schedule_gate.outputs.run_strategy == 'true'
        run: |
          git config user.name "stats4bets-automation"
          git config user.email "actions@users.noreply.github.com"
          git add strategy_latest.json
          if git diff --cached --quiet; then
            echo "Classifica invariata: nessun commit necessario."
          else
            git commit -m "Aggiorna automaticamente Classifica Elite"
            git push
          fi
